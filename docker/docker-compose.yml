# ProofHire — Optional Local PostgreSQL Service
# Use this ONLY if Docker is installed and you prefer containerized database persistence.
# If Docker is not installed, ProofHire runs resiliently with in-memory domain persistence.

services:
  postgres:
    image: postgres:16-alpine
    container_name: proofhire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proofhire
    ports:
      - "5432:5432"
    volumes:
      - proofhire_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  proofhire_pgdata:
    name: proofhire_pgdata
